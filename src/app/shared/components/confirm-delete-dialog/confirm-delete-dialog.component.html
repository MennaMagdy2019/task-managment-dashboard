<h2 mat-dialog-title>{{ 'confirmDelete.title' | translate }}</h2>
<mat-dialog-content>
  {{ 'confirmDelete.body' | translate: { title: data.taskTitle } }}
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" mat-dialog-close>{{ 'common.cancel' | translate }}</button>
  <button mat-flat-button type="button" color="warn" (click)="confirm()">
    {{ 'confirmDelete.confirm' | translate }}
  </button>
</mat-dialog-actions>
