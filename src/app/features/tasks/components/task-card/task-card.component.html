<mat-card
  appearance="outlined"
  class="task-card"
  [class.high-priority]="task.priority === 'high'"
  [class.medium-priority]="task.priority === 'medium'"
  [class.low-priority]="task.priority === 'low'"
>
  <mat-card-content>
    <div class="task-card-toolbar">
      <mat-chip-set aria-label="Task priority">
        <mat-chip
          class="priority-chip"
          [class.high]="task.priority === 'high'"
          [class.medium]="task.priority === 'medium'"
          [class.low]="task.priority === 'low'"
          [color]="
            task.priority === 'high' ? 'warn' : task.priority === 'medium' ? 'accent' : 'primary'
          "
        >
          {{ task.priority | titlecase }}
        </mat-chip>
      </mat-chip-set>
      <button
        mat-icon-button
        type="button"
        aria-label="Task actions"
        [matMenuTriggerFor]="taskActions"
      >
        <span aria-hidden="true">⋮</span>
      </button>
      <mat-menu #taskActions="matMenu">
        <button mat-menu-item type="button" (click)="edit.emit(task)">Edit task</button>
        <button mat-menu-item type="button" (click)="remove.emit(task)">Delete task</button>
      </mat-menu>
    </div>
    <mat-card-title>{{ task.title }}</mat-card-title>
    <p>{{ task.description }}</p>
    @if (task.tags.length) {
      <mat-chip-set aria-label="Task labels">
        @for (tag of task.tags; track tag) {
          <mat-chip>{{ tag }}</mat-chip>
        }
      </mat-chip-set>
    }
  </mat-card-content>
  <mat-card-actions>
    <span class="assignee-chip" [attr.aria-label]="'Assigned to ' + task.assignee.name">
      <span class="assignee-avatar" aria-hidden="true">{{ task.assignee.initials }}</span>
      <span>{{ task.assignee.name }}</span>
    </span>
    <span class="due-date" [class.overdue]="overdue">
      <span aria-hidden="true">◷</span>
      {{ dueLabel }}
      @if (overdue) {
        · Overdue
      }
    </span>
  </mat-card-actions>
</mat-card>
