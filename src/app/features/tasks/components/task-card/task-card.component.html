<mat-card
  appearance="outlined"
  class="task-card"
  [class.overdue]="overdue"
  [class.status-todo]="task.status === 'todo'"
  [class.status-in-progress]="task.status === 'in_progress'"
  [class.status-done]="task.status === 'done'"
>
  <mat-card-content>
    <div class="task-card-toolbar">
      <div class="task-priority" role="group" aria-label="Task priority">
        <span
          class="priority-chip"
          [class.high]="task.priority === 'high'"
          [class.medium]="task.priority === 'medium'"
          [class.low]="task.priority === 'low'"
        >
          {{ task.priority }}
        </span>
      </div>
      <button
        mat-icon-button
        type="button"
        aria-label="Task actions"
        [matMenuTriggerFor]="taskActions"
      >
        <span aria-hidden="true">⋮</span>
      </button>
      <mat-menu #taskActions="matMenu">
        <button mat-menu-item type="button" (click)="edit.emit(task)">Edit task</button>
        <button mat-menu-item type="button" (click)="remove.emit(task)">Delete task</button>
      </mat-menu>
    </div>
    <mat-card-title>{{ task.title }}</mat-card-title>
    <p>{{ task.description }}</p>
    <div class="task-meta">
      <span class="due-date" [class.overdue]="overdue">
        <span class="material-icons due-date-icon" aria-hidden="true">{{ dateStatusIcon }}</span>
        {{ dueLabel }}
      </span>
      @if (task.tags.length) {
        <div class="task-labels" role="group" aria-label="Task labels">
          @for (tag of task.tags; track tag) {
            <span>{{ tag }}</span>
          }
        </div>
      }
    </div>
  </mat-card-content>
  <mat-card-actions>
    <span class="assignee-chip" [attr.aria-label]="'Assigned to ' + task.assignee.name">
      <span class="assignee-avatar" aria-hidden="true">{{ task.assignee.initials }}</span>
      <span>{{ task.assignee.name }}</span>
    </span>
  </mat-card-actions>
</mat-card>
