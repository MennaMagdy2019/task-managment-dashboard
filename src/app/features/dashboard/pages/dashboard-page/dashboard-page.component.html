<div
  class="dashboard-layout flex min-h-screen flex-col overflow-x-clip bg-[#f4f6f9] text-[#252b36]"
>
  <app-dashboard-header
    class="block"
    [query]="query()"
    [userInitials]="currentUser.initials"
    [sidebarOpen]="sidebarOpen()"
    (queryChange)="query.set($event)"
    (menuToggle)="toggleSidebar()"
  >
  </app-dashboard-header>

  <mat-sidenav-container
    class="app-shell h-[calc(100vh_-_44px)] min-h-[420px] overflow-x-hidden bg-[#f4f6f9] max-md:h-[calc(100vh_-_50px)]"
  >
    <mat-sidenav
      class="sidebar box-border w-[152px] border-r border-[#e4e8ee] bg-white px-3 py-1 max-md:w-[min(270px,85vw)]"
      [mode]="isMobile() ? 'over' : 'side'"
      [opened]="!isMobile() || sidebarOpen()"
      (closedStart)="sidebarOpen.set(false)"
      [attr.aria-label]="'navigation.main' | translate"
    >
      <app-dashboard-sidebar
        class="block h-full"
        [users]="users"
        [assigneeFilter]="assigneeFilter()"
        [teamExpanded]="teamExpanded()"
        (navigationSelected)="selectNavigationItem($event)"
        (routeSelected)="onRouteSelected($event)"
        (assigneeSelected)="setAssignee($event)"
        (createTask)="openCreate()"
      >
      </app-dashboard-sidebar>
    </mat-sidenav>

    <mat-sidenav-content class="main-shell min-w-0 overflow-x-hidden bg-[#f4f6f9]">
      <main
        class="page-content mx-auto w-full max-w-[1600px] px-4 pb-6 pt-2 max-lg:px-3 max-md:px-2.5 max-md:pb-5"
      >
        @if (store.error()) {
          <mat-card role="alert">
            <mat-card-content>
              <p>{{ 'page.loadError' | translate }}</p>
              <button mat-button type="button" (click)="store.resource.reload()">
                {{ 'common.retry' | translate }}
              </button>
            </mat-card-content>
          </mat-card>
        }

        @if (view() === 'analytics') {
          <app-dashboard-insights
            class="block"
            [tasks]="tasks()"
            [activities]="activities()"
          ></app-dashboard-insights>
        } @else {
          <app-dashboard-summary
            class="block"
            [stats]="stats()"
            [completionRate]="completionRate()"
            [isLoading]="store.isLoading()"
            [columns]="statColumns()"
          >
          </app-dashboard-summary>

          @defer (on idle) {
            <app-task-board
              class="block"
              [columns]="columns"
              [tasks]="filteredTasks()"
              [loading]="store.isLoading()"
              [hasMatchingTasks]="filteredTasks().length > 0"
              [statusFilter]="statusFilter()"
              [priorityFilter]="priorityFilter()"
              [dropListIds]="dropListIds"
              (statusFilterChange)="statusFilter.set($event)"
              (priorityFilterChange)="priorityFilter.set($event)"
              (createTask)="openCreate()"
              (editTask)="openEdit($event)"
              (removeTask)="askDelete($event)"
              (taskDropped)="onDrop($event)"
            >
            </app-task-board>
          } @placeholder {
            <section
              class="board-section block"
              [attr.aria-label]="'board.aria' | translate"
              aria-busy="true"
            >
              <div
                class="mb-3 min-h-9 rounded-md border border-[#e5e8ed] bg-white"
                aria-hidden="true"
              ></div>
              <div
                class="grid min-h-[470px] grid-cols-3 items-start gap-3 max-lg:grid-cols-2 max-md:min-h-0 max-md:grid-cols-1"
                aria-hidden="true"
              >
                @for (column of columns; track column.status) {
                  <div class="min-w-0 rounded-md border border-[#e6e9ee] bg-white">
                    <div class="h-8 border-b border-[#e8ebef]"></div>
                    <div class="grid content-start gap-2 p-[7px]">
                      @for (skeleton of loadingSkeletons[column.status]; track skeleton) {
                        <div class="h-[164px] rounded border border-[#e6e9ee] bg-white"></div>
                      }
                    </div>
                  </div>
                }
              </div>
            </section>
          }
        }
      </main>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
